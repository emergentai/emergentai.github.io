nks/637-fbdf01c6e43ad67b.js\",\"308:static/chunks/app/blog/[slug]/page-75daf39c28fd71ab.js\"],\"name\":\"FloatingCopyLink\",\"async\":false}\n12:T6f2,"])</script><script>self.__next_f.push([1,"\nGovernment procurement is genuinely hard to navigate. Opportunities are scattered across portals, posted in dense PDF formats, and easy to miss if you're not watching the right places at the right time. And once you find something relevant, you still have to read through pages of requirements before knowing if it's even worth pursuing.\n\nWe've been doing this ourselves — as a [Government of Canada approved AI supplier](/blog/gc-approved-supplier), we started paying closer attention to procurement postings. And pretty quickly, we thought: this is exactly the kind of problem AI should be solving.\n\nSo we built something.\n\n## What it does\n\nBids is an AI agent that helps you find, understand, and respond to government procurement opportunities. Point it at a category or keyword, and it surfaces relevant bids. Ask it about a specific posting, and it breaks down the requirements in plain language. When you're ready to respond, it helps you draft.\n\nIt's not magic. It doesn't win bids for you. But it takes the part of the process that's mostly reading, filtering, and formatting — and handles it so your team can focus on the part that actually requires your expertise.\n\n## Why we're sharing it now\n\nThis is a prototype. It's rough in places, and we're still figuring out what's most useful. But we've found it genuinely helpful in our own work, and we'd rather put it in front of real people than polish it in private.\n\nIf you work in procurement, bid on government contracts, or have been curious about what AI can do for this kind of process, we'd love for you to try it.\n\n[Try the Bids prototype](https://bids.emergentai.ca)\n\nWe're paying attention to what works and what doesn't. If you have feedback, [we want to hear it](/schedule).\n\n_With care,_\n\nEmergent AI\n"])</sc e part that actually requires your expertise.\"}],\"\\n\",[\"$\",\"h2\",null,{\"className\":\"mt-10 scroll-m-20 border-b border-b-zinc-100 pb-1 text-xl font-medium tracking-tight first:mt-0\",\"id\":\"why-were-sharing-it-now\",\"children\":[[\"$\",\"$L10\",null,{\"className\":\"font-medium text-zinc-900 dark:text-white underline underline-offset-4 subheading-anchor\",\"aria-label\":\"Link to section\",\"href\":\"#why-were-sharing-it-now\",\"children\":[\"$\",\"span\",null,{\"className\":\"icon icon-link\"}]}],\"Why we're sharing it now\"]}],\"\\n\",[\"$\",\"p\",null,{\"className\":\"leading-7 [\u0026:not(:first-child)]:mt-6\",\"children\":\"This is a prototype. It's rough in places, and we're still figuring out what's most useful. But we've found it genuinely helpful in our own work, and we'd rather put it in front of real people than polish it in private.\"}],\"\\n\",[\"$\",\"p\",null,{\"className\":\"leading-7 [\u0026:not(:first-child)]:mt-6\",\"children\":\"If you work in procurement, bid on government contracts, or have been curious about what AI can do for this kind of process, we'd love for you to try it.\"}],\"\\n\",[\"$\",\"p\",null,{\"className\":\"leading-7 [\u0026:not(:first-child)]:mt-6\",\"children\":[\"$\",\"$L10\",null,{\"className\":\"font-medium text-zinc-900 dark:text-white underline underline-offset-4\",\"href\":\"https://bids.emergentai.ca\",\"children\":\"Try the Bids prototype\"}]}],\"\\n\",[\"$\",\"p\",null,{\"className\":\"leading-7 [\u0026:not(:first-child)]:mt-6\",\"children\":[\"We're paying attention to what works and what doesn't. If you have feedback, \",[\"$\",\"$L10\",null,{\"className\":\"font-medium text-zinc-900 dark:text-white underline underline-offset-4\",\"href\":\"/schedule\",\"children\":\"we want to hear it\"}],\".\"]}],\"\\n\",[\"$\",\"p\",null,{\"className\":\"leading-7 [\u0026:not(:first-child)]:mt-6\",\"children\":[\"$\",\"em\",null,{\"children\":\"With care,\"}]}],\"\\n\",[\"$\",\"p\",null,{\"className\":\"leading-7 [\u
